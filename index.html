<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <title>TechWave</title>
</head>
<body class="inter-font">
    <header class="section-width">
        <nav class="navbar">
            <h2 class="heading2">Tech<span class="wave">Wave</span></h2>
            <ul class="menu">
                <li><a class="text" href="#">About</a></li>
                <li><a class="text" href="#">Episodes</a></li>
                <li><a class="text" href="#">Host</a></li>
            </ul>
            <button class="primary-btn inter-font" type="button">Subscribe <i class="fa-solid fa-arrow-right"></i></button>
            <span class="hamburger-menu"><i class="fa-solid fa-bars"></i></span>
        </nav>
        <section class="banner">
                <div class="banner-container">
                    <div class="podcast">
                         <img class="podcast-img" src="./assets/microphone.png">
                         <div class="badge">
                            <p>NEW</p>
                         </div>
                    </div>
                    <div class="banner-text">
                        <h1>TechWave</h1>
                        <p class="text">Your daily dose of tech insights, productivity hacks, and personal growth</p>
                        <div class="btn-container">
                            <button class="primary-btn"> <i class="fa-brands fa-spotify"></i> Listen on Spotify</button>
                            <button class="subscribe"><i class="fa-regular fa-envelope"></i> Subscribe</button>
                        </div>
                        
                    </div>
                </div>
        </section>
    </header>

</body>
</html>
